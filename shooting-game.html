<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>슈팅게임 - 보스 전투</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a1a1a;
            font-family: Arial, sans-serif;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
        }

        .game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            max-width: 100%;
            max-height: 100%;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(180deg, #87CEEB 0%, #1a1a2e 100%);
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            touch-action: none;
        }

        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: white;
            font-size: 24px;
        }

        #gameOverScreen.show {
            display: flex;
        }

        #gameOverScreen h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ff6b6b;
        }

        #gameOverScreen p {
            margin: 10px;
            font-size: 28px;
        }

        #gameOverScreen button {
            margin-top: 30px;
            padding: 15px 30px;
            font-size: 24px;
            background: #ff6b6b;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.3s;
        }

        #gameOverScreen button:hover {
            background: #ff5252;
        }

        .info {
            position: fixed;
            top: 10px;
            left: 10px;
            color: #fff;
            font-size: 16px;
            z-index: 100;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .info div {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="info">
            <div>Stage: <span id="stage">1</span>/10</div>
            <div>Score: <span id="score">0</span></div>
            <div>HP: <span id="hp">3</span></div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div id="gameOverScreen">
            <h1 id="gameOverTitle">GAME OVER</h1>
            <p>점수: <span id="finalScore">0</span></p>
            <p>클리어한 스테이지: <span id="finalStage">0</span>/10</p>
            <button onclick="location.reload()">다시 시작</button>
        </div>
    </div>

    <script>
        try {
            const canvas = document.getElementById('gameCanvas');
            if (!canvas) throw new Error('Canvas not found');

            const ctx = canvas.getContext('2d', { antialias: false });
            if (!ctx) throw new Error('Canvas context failed');

            // 캔버스 크기 설정
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            window.addEventListener('orientationchange', () => {
                setTimeout(resizeCanvas, 100);
            });

            // 게임 설정
            let GAME_WIDTH = canvas.width;
            let GAME_HEIGHT = canvas.height;

            // 게임 상태
            let gameState = {
                score: 0,
                hp: 3,
                stage: 1,
                gameOver: false,
                won: false
            };

            // 플레이어 클래스
            class Player {
                constructor() {
                    this.x = GAME_WIDTH / 2;
                    this.y = GAME_HEIGHT - 60;
                    this.width = 24;
                    this.height = 24;
                    this.speed = 5;
                }

                update(input) {
                    if (input.left && this.x > 10) {
                        this.x -= this.speed;
                    }
                    if (input.right && this.x < GAME_WIDTH - 10) {
                        this.x += this.speed;
                    }
                }

                draw() {
                    ctx.fillStyle = '#FFD700';
                    ctx.fillRect(this.x - 8, this.y - 12, 16, 24);
                    ctx.fillStyle = '#FFA500';
                    ctx.fillRect(this.x - 12, this.y - 4, 8, 8);
                    ctx.fillRect(this.x + 4, this.y - 4, 8, 8);
                    ctx.fillStyle = '#FF6B6B';
                    ctx.fillRect(this.x - 2, this.y - 16, 4, 4);
                }
            }

            // 총알 클래스
            class Bullet {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.width = 4;
                    this.height = 8;
                    this.speed = 8;
                }

                update() {
                    this.y -= this.speed;
                }

                draw() {
                    ctx.fillStyle = '#FFD700';
                    ctx.fillRect(this.x - 2, this.y, 4, 8);
                }

                isOffScreen() {
                    return this.y < 0;
                }
            }

            // 적 총알 클래스
            class EnemyBullet {
                constructor(x, y, vx = 0, vy = 3) {
                    this.x = x;
                    this.y = y;
                    this.vx = vx;
                    this.vy = vy;
                    this.radius = 3;
                }

                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                }

                draw() {
                    ctx.fillStyle = '#FF6B6B';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                }

                isOffScreen() {
                    return this.y > GAME_HEIGHT;
                }
            }

            // 보스 클래스
            class Boss {
                constructor(stageNum) {
                    this.stageNum = stageNum;
                    this.x = GAME_WIDTH / 2;
                    this.y = 80;
                    this.width = 40;
                    this.height = 40;
                    this.maxHp = 50 + stageNum * 20;
                    this.hp = this.maxHp;
                    this.shootCounter = 0;
                    this.moveCounter = 0;
                    this.speed = 1 + stageNum * 0.3;
                    this.shootInterval = Math.max(20, 60 - stageNum * 4);
                }

                update() {
                    this.moveCounter++;
                    this.x += Math.sin(this.moveCounter * 0.02) * this.speed;

                    if (this.x < this.width / 2) this.x = this.width / 2;
                    if (this.x > GAME_WIDTH - this.width / 2) this.x = GAME_WIDTH - this.width / 2;

                    this.shootCounter++;
                }

                shoot() {
                    const bullets = [];

                    if (this.stageNum <= 3) {
                        bullets.push(new EnemyBullet(this.x, this.y, 0, 3));
                    } else if (this.stageNum <= 6) {
                        for (let i = -2; i <= 2; i++) {
                            bullets.push(new EnemyBullet(this.x + i * 15, this.y, i * 1, 3));
                        }
                    } else {
                        const angle = (this.shootCounter * 0.05) % (Math.PI * 2);
                        for (let i = 0; i < 6; i++) {
                            const a = angle + (Math.PI * 2 / 6) * i;
                            bullets.push(new EnemyBullet(
                                this.x + Math.cos(a) * 10,
                                this.y + Math.sin(a) * 10,
                                Math.cos(a + Math.PI / 2) * 2,
                                Math.sin(a + Math.PI / 2) * 2 + 1
                            ));
                        }
                    }

                    return bullets;
                }

                draw() {
                    ctx.fillStyle = '#FF4444';
                    ctx.fillRect(this.x - 20, this.y - 20, 40, 40);

                    ctx.fillStyle = '#FF8800';
                    ctx.fillRect(this.x - 16, this.y - 16, 10, 10);
                    ctx.fillRect(this.x + 6, this.y - 16, 10, 10);

                    ctx.fillStyle = '#FFD700';
                    ctx.fillRect(this.x - 8, this.y - 8, 16, 16);

                    const hpPercent = this.hp / this.maxHp;
                    ctx.fillStyle = '#FF0000';
                    ctx.fillRect(this.x - 20, this.y - 28, 40, 4);
                    ctx.fillStyle = '#00FF00';
                    ctx.fillRect(this.x - 20, this.y - 28, 40 * hpPercent, 4);
                }

                isDefeated() {
                    return this.hp <= 0;
                }
            }

            // 폭발 효과
            class Explosion {
                constructor(x, y, size = 20) {
                    this.x = x;
                    this.y = y;
                    this.size = size;
                    this.maxSize = size;
                    this.maxDuration = 10;
                    this.duration = 0;
                }

                update() {
                    this.duration++;
                }

                draw() {
                    const progress = this.duration / this.maxDuration;
                    const currentSize = this.maxSize * (1 + progress);

                    ctx.fillStyle = `rgba(255, 100, 0, ${1 - progress})`;
                    ctx.fillRect(this.x - currentSize/2, this.y - currentSize/2, currentSize, currentSize);

                    ctx.fillStyle = `rgba(255, 200, 0, ${0.8 - progress * 0.8})`;
                    ctx.fillRect(this.x - currentSize/3, this.y - currentSize/3, currentSize*2/3, currentSize*2/3);
                }

                isFinished() {
                    return this.duration >= this.maxDuration;
                }
            }

            // 게임 객체들
            let player = new Player();
            let bullets = [];
            let enemyBullets = [];
            let boss = new Boss(gameState.stage);
            let explosions = [];

            // 입력 처리
            const input = { left: false, right: false };

            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') input.left = true;
                if (e.key === 'ArrowRight') input.right = true;
            });

            document.addEventListener('keyup', (e) => {
                if (e.key === 'ArrowLeft') input.left = false;
                if (e.key === 'ArrowRight') input.right = false;
            });

            // 터치 입력
            let touchX = GAME_WIDTH / 2;

            document.addEventListener('touchstart', (e) => {
                if (e.touches.length > 0) {
                    touchX = (e.touches[0].clientX / window.innerWidth) * GAME_WIDTH;
                }
            }, { passive: false });

            document.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (e.touches.length > 0) {
                    touchX = (e.touches[0].clientX / window.innerWidth) * GAME_WIDTH;
                    const centerX = GAME_WIDTH / 2;
                    input.left = touchX < centerX - 50;
                    input.right = touchX > centerX + 50;
                }
            }, { passive: false });

            document.addEventListener('touchend', (e) => {
                input.left = false;
                input.right = false;
            }, { passive: false });

            // 마우스 입력
            document.addEventListener('mousemove', (e) => {
                const mouseX = (e.clientX / window.innerWidth) * GAME_WIDTH;
                const centerX = GAME_WIDTH / 2;

                input.left = mouseX < centerX - 50;
                input.right = mouseX > centerX + 50;
            });

            // 게임 업데이트
            function update() {
                if (gameState.gameOver) return;

                player.update(input);

                if (Math.random() < 0.1) {
                    bullets.push(new Bullet(player.x, player.y - 15));
                }

                bullets = bullets.filter(b => {
                    b.update();
                    return !b.isOffScreen();
                });

                boss.update();

                if (boss.shootCounter % boss.shootInterval === 0) {
                    const newBullets = boss.shoot();
                    enemyBullets.push(...newBullets);
                }

                enemyBullets = enemyBullets.filter(b => {
                    b.update();
                    return !b.isOffScreen();
                });

                bullets = bullets.filter(bullet => {
                    for (let i = 0; i < enemyBullets.length; i++) {
                        const eb = enemyBullets[i];
                        if (Math.hypot(bullet.x - eb.x, bullet.y - eb.y) < 10) {
                            enemyBullets.splice(i, 1);
                            explosions.push(new Explosion(bullet.x, bullet.y, 12));
                            return false;
                        }
                    }

                    if (bullet.x > boss.x - boss.width/2 &&
                        bullet.x < boss.x + boss.width/2 &&
                        bullet.y > boss.y - boss.height/2 &&
                        bullet.y < boss.y + boss.height/2) {
                        boss.hp--;
                        explosions.push(new Explosion(bullet.x, bullet.y, 15));
                        gameState.score += 10;
                        return false;
                    }

                    return true;
                });

                for (let i = enemyBullets.length - 1; i >= 0; i--) {
                    const eb = enemyBullets[i];
                    if (Math.hypot(player.x - eb.x, player.y - eb.y) < 15) {
                        enemyBullets.splice(i, 1);
                        gameState.hp--;
                        explosions.push(new Explosion(player.x, player.y, 20));
                        gameState.score = Math.max(0, gameState.score - 50);

                        if (gameState.hp <= 0) {
                            gameState.gameOver = true;
                            showGameOver();
                        }
                    }
                }

                explosions = explosions.filter(e => {
                    e.update();
                    return !e.isFinished();
                });

                if (boss.isDefeated()) {
                    gameState.score += 500 * gameState.stage;

                    if (gameState.stage >= 10) {
                        gameState.won = true;
                        gameState.gameOver = true;
                        showGameOver();
                    } else {
                        gameState.stage++;
                        boss = new Boss(gameState.stage);
                        enemyBullets = [];
                        bullets = [];
                        explosions = [];
                    }
                }

                document.getElementById('score').textContent = gameState.score;
                document.getElementById('hp').textContent = gameState.hp;
                document.getElementById('stage').textContent = gameState.stage;
            }

            // 게임 그리기
            function draw() {
                GAME_WIDTH = canvas.width;
                GAME_HEIGHT = canvas.height;

                ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

                const gradient = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
                gradient.addColorStop(0, '#87CEEB');
                gradient.addColorStop(1, '#1a1a2e');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                for (let i = 0; i < 30; i++) {
                    const x = (i * 73 + gameState.score * 0.1) % GAME_WIDTH;
                    const y = (i * 37) % GAME_HEIGHT;
                    ctx.fillRect(x, y, 2, 2);
                }

                player.draw();
                boss.draw();

                bullets.forEach(b => b.draw());
                enemyBullets.forEach(b => b.draw());
                explosions.forEach(e => e.draw());
            }

            function showGameOver() {
                const gameOverScreen = document.getElementById('gameOverScreen');
                document.getElementById('finalScore').textContent = gameState.score;
                document.getElementById('finalStage').textContent = gameState.stage;

                if (gameState.won) {
                    document.getElementById('gameOverTitle').textContent = '게임 클리어!';
                }

                gameOverScreen.classList.add('show');
            }

            // 게임 루프
            let animationId = null;
            function gameLoop() {
                update();
                draw();
                animationId = requestAnimationFrame(gameLoop);
            }

            // 게임 시작
            function startGame() {
                console.log('🎮 게임 시작됨');
                gameLoop();
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', startGame);
            } else {
                startGame();
            }
        } catch (error) {
            console.error('게임 에러:', error);
            alert('게임 로드 실패: ' + error.message);
        }
    </script>
</body>
</html>
